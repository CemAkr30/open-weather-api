global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ '10.251.101.181:8080' ] ##host.docker.internal

  - job_name: 'zipkin'
    static_configs:
      - targets: [ 'zipkin:9411' ]

  - job_name: 'loki'
    static_configs:
      - targets: [ 'loki:3100' ]
