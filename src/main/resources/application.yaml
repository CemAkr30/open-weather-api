spring:
  application:
    name: open-weather-api
  profiles:
    active: dev
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:weatherdb
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include:
          - "*"
          - prometheus

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.open.weather.api: DEBUG
  pattern:
    console: ""


weather-stack:
  api-url: http://api.weatherstack.com/current
  api-key: ${WEATHER_STACK_API_KEY:e30375f56a610e97716b72d189beef37}
  api-call-limit: 30
  cache-name: weathers
  cache-ttl: 10000


