spring:
  application:
    name: open-weather-api
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:weatherdb
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true


management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
          - prometheus

weather-stack:
  api-url: http://api.weatherstack.com/current
  api-key: ${WEATHER_STACK_API_KEY:e30375f56a610e97716b72d189beef37}
  api-call-limit: 30
  cache-name: weathers
  cache-ttl: 10000


